version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: quarterly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: quarterly
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns:
          - '@typescript-eslint/*'
          - '@eslint/*'
          - '@eslint-community/*'
          - 'eslint'
          - 'eslint-*'
          - 'prettier'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
